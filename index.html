async function api(path,body){const response=await fetch('api/'+path,{method:body?'POST':'GET',credentials:'same-origin',headers:body?{'Content-Type':'application/json','X-CSRF-Token':csrf}:{},...(body?{body:JSON.stringify(body)}:{})});const r=await response.json();if(!response.ok){const error=new Error(r.error||'Request failed');error.status=response.status;throw error}return r}
function accept(r){data=r.state;userId=r.me;version=r.version;csrf=r.csrf}
async function pull(){const r=await api('state');accept(r);render()}
async function perform(a){if(busy)return null;busy=true;const expected=$('#modal').open?modalVersion:version;$$('#modal button[type=submit], #modal .actions button').forEach(x=>x.disabled=true);try{let id;if(live){const r=await api('action',{version:expected,action:a});accept(r);id=r.id}else{const next=structuredClone(data);if(a.type==='disable_user'){if(role()!=='company'||a.userId===userId)throw new Error('Action not allowed.');const u=next.users.find(u=>u.id===a.userId);u.disabled=!!a.disabled;id=u.id}else if(a.type==='reset_password'){throw new Error(tr('demoAuth'))}else id=Care.action(next,userId,a);await localSave(next);data=next;version++;}return id}catch(error){if(error.status===401){closeModal();userId='';data=null;renderLogin()}else if(error.status===409){closeModal();await pull();toast(error.message)}else inlineError(error);return null}finally{busy=false;$$('#modal button:disabled').forEach(x=>x.disabled=false)}}
function stopRecording(){clearTimeout(recordTimer);if(recording&&recording.state!=='inactive')recording.stop();recordStream?.getTracks().forEach(t=>t.stop());recordStream=null}
function closeModal(){destroyMap();stopRecording();$('#modal').close();selectedId='';draft=null}
function modal(title,html,keep=false){destroyMap();if(!keep)stopRecording();modalVersion=version;$('#modal').innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button class="close" data-action="close" aria-label="${tr('closeDialog')}">${icon('close')}</button></div><div class="modal-body">${html}<div id="form-error" class="error-text" role="alert"></div></div>`;if(!$('#modal').open)$('#modal').showModal();$('#modal').scrollTop=0}
function setLanguage(){lang=lang==='en'?'ar':'en';pref.set('care-language',lang);document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';if(data&&userId){render();if(selectedId)detail(selectedId);else if(draft)wizard();}else renderLogin()}
function navItems(){return [{id:'home',icon:'home',label:'home'},{id:'requests',icon:'requests',label:role()==='client'?'requests':'allRequests'},{id:'properties',icon:'building',label:role()==='client'?'properties':'allProperties'},...(role()==='client'?[]:[{id:'schedule',icon:'calendar',label:'schedule'}]),...(role()==='company'?[{id:'team',icon:'team',label:'team'}]:[]),{id:'settings',icon:'settings',label:'settings'}]}
function navHtml(){return navItems().map(n=>`<button class="nav-item ${page===n.id?'active':''}" data-nav="${n.id}">${icon(n.icon)}<span>${tr(n.label)}</span></button>`).join('')}
function updates(){const read=pref.get('care-read-'+userId)||'1970';return visible().tickets.flatMap(t=>t.history.filter(h=>h.actorId!==userId&&h.at>read).map(h=>({t,h}))).sort((a,b)=>b.h.at.localeCompare(a.h.at))}
function render(){if(!data||!userId)return renderLogin();document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';const u=user();if(!u){return renderLogin()}const title=navItems().find(n=>n.id===page)?.label||'home';$('#app').innerHTML=`<aside class="sidebar">${brand()}<div class="workspace">UNITY FACILITIES MANAGEMENT</div><nav aria-label="Main navigation">${navHtml()}</nav><div class="side-foot"><div class="care-note"><b>${tr('brand')}</b><p>${tr('clientSub')}</p></div><small>UNITY CARE · 2.1</small></div></aside><div class="main-shell"><header class="topbar"><div class="crumb">Unity Care <span>/</span><b>${tr(title)}</b></div><div class="top-actions">${live?'':`<div class="role-select"><label for="demo-role">${tr('previewAs')}</label><select id="demo-role">${data.users.filter(x=>!x.disabled).map(x=>`<option value="${e(x.id)}" ${x.id===userId?'selected':''}>${tr(x.role)} · ${e(x.name)}</option>`).join('')}</select></div>`}<button class="language-btn" data-action="language" aria-label="${lang==='en'?'Switch to Arabic':'Switch to English'}">${lang==='en'?'العربية':'English'}</button><button class="icon-btn" data-action="notifications" aria-label="${tr('notifications')}">${icon('bell')}${updates().length?`<span class="notification-dot">${Math.min(updates().length,99)}</span>`:''}</button><button class="avatar" data-nav="settings" aria-label="${tr('profile')}">${e(initials(u.name))}</button></div></header>${live&&!navigator.onLine?`<div class="offline-bar">${tr('noNetwork')}</div>`:''}<main class="page" id="main">${pageContent()}</main><footer class="footer"><span class="status-dot"></span><span>${live?tr('liveHint'):tr('demoNotice')}</span></footer><nav class="nav-mobile" aria-label="Mobile navigation">${navHtml()}</nav></div>`;$('#demo-role')?.addEventListener('change',ev=>{userId=ev.target.value;pref.set('care-user',userId);page='home';filter='all';search='';render()});$('#request-search')?.addEventListener('input',ev=>{search=ev.target.value;$('#request-results').innerHTML=requestResults()});}
function heading(title,sub,action=true){return `<div class="heading"><div><h1>${title}</h1><p>${sub}</p></div>${action&&role()!=='tech'?button(`<span class="hide-mobile">${tr('new')}</span>`,'new','','','plus'):''}</div>`}
function card(t){return `<button class="request-card" data-action="detail" data-id="${e(t.id)}"><div class="card-top"><span class="ticket-id">${e(t.id)}</span>${badge(t)}</div><div class="request-title"><span class="category-icon">${icon(t.category)}</span><div><h3>${e(t.title)}</h3><p>${e(propOf(t.propertyId)?.name||'')} · ${e(t.unit)}</p></div></div><div class="request-bottom">${priority(t)}<span>${t.techId?e(nameOf(t.techId)):tr('unassigned')} &nbsp; ↗</span></div></button>`}
function visits(){return visible().tickets.filter(t=>t.visitStart&&!['closed','resolved'].includes(t.status)).sort((a,b)=>a.visitStart.localeCompare(b.visitStart))}
function visitCard(t){return `<div class="visit-card"><div class="visit-date"><span>${fmt(t.visitStart)}</span><span>${fmt(t.visitStart,{day:undefined,month:undefined,hour:'2-digit',minute:'2-digit'})}–${fmt(t.visitEnd,{day:undefined,month:undefined,hour:'2-digit',minute:'2-digit'})}</span></div><h3>${e(t.title)}</h3><p>${e(propOf(t.propertyId)?.name||'')} · ${tr('qatar')}</p><div class="person-row"><span class="avatar warm">${e(initials(nameOf(t.techId)))}</span><div><b>${e(nameOf(t.techId))}</b><small>${tr('technician')}</small></div><button class="text-btn" data-action="detail" data-id="${e(t.id)}">${tr('view')}${icon('arrow')}</button></div></div>`}
function pageContent(){if(page==='home')return homePage();if(page==='requests')return requestsPage();if(page==='properties')return propertiesPage();if(page==='schedule')return heading(tr('schedule'),tr('qatar'),false)+`<section class="panel">${visits().map(visitCard).join('')||empty('noVisits','calendar')}</section>`;if(page==='team'&&role()==='company')return teamPage();return settingsPage()}
function empty(k,ico='requests'){return `<div class="empty">${icon(ico)}<p>${tr(k)}</p></div>`}
function homePage(){const client=role()==='client',tech=role()==='tech',tickets=visible().tickets,pending=tickets.find(t=>t.status==='approval'),review=tickets.find(t=>t.status==='resolved');let h=heading(client?tr('hello')+', '+e(user().name.split(' ')[0])+'.':tech?tr('techTitle'):tr('companyTitle'),client?tr('clientSub'):tech?tr('techSub'):tr('companySub'));h+=`<section class="hero"><div><div class="eyebrow">${tr('portal')}</div><h2>${client?tr('welcome'):tr('brand')}</h2><p>${client?tr('reportHint'):tr('companySub')}</p>${button(client?tr('newRequest'):tr('allRequests'),client?'new':'nav-requests','lime','','arrow')}</div>${art}</section>`;if(client)h+=`<div class="quick-actions">${[['new','photo','newRequest','reportHint'],['nav-requests','requests','track','clientSub'],['nav-properties','shield','passport','passportHint']].map(([a,i,t,s])=>`<button class="quick-card" data-action="${a}">${icon(i)}<span><b>${tr(t)}</b><small>${tr(s)}</small></span><span class="arrow">↗</span></button>`).join('')}</div>`;else h+=`<section class="stats">${[['open',openTickets().length,'requests'],['attention',tickets.filter(t=>['submitted','approval'].includes(t.status)).length,'bell'],['visits',visits().length,'calendar'],['completed',tickets.filter(t=>['resolved','closed'].includes(t.status)).length,'check']].map(([k,n,i])=>`<div class="stat"><div class="stat-top">${tr(k)}${icon(i)}</div><strong>${n}</strong><small>${tr('updated')} · ${fmt(new Date().toISOString())}</small></div>`).join('')}</section>`;h+=`<div class="two-col"><section class="panel"><div class="panel-head"><h2>${tr('recent')}</h2><button class="text-btn" data-nav="requests">${tr('viewAll')} ${icon('arrow')}</button></div>${tickets.slice(0,5).map(card).join('')||empty('noRequests')}</section><aside class="aside-content">${client&&(pending||review)?`<section class="spotlight"><span class="badge approval">${tr(pending?'approval':'resolved')}</span><h3>${e((pending||review).title)}</h3><p>${tr(pending?'reviewNeeded':'reviewHint')}</p>${pending?`<div class="amount">${money(pending.quote.total)}</div>`:''}${button(tr(pending?'estimate':'confirmRepair'),'detail','wide',(pending||review).id)}</section>`:''}<section class="panel"><div class="panel-head"><h2>${tr('currentVisit')}</h2>${icon('calendar')}</div>${visits().slice(0,2).map(visitCard).join('')||empty('noVisits','calendar')}</section>${dueAssets()}</aside></div>`;return h}
function dueAssets(){let list=visible().assets.filter(a=>a.nextService&&new Date(a.nextService+'T12:00:00+03:00')<new Date(Date.now()+14*86400000));if(!list.length)return '';return `<section class="panel"><div class="panel-head"><h2>${tr('dueSoon')}</h2>${icon('general')}</div>${list.map(a=>`<div class="visit-card"><h3>${e(a.name)}</h3><p>${e(propOf(a.propertyId)?.name)} · ${fmt(a.nextService)}</p><div class="actions">${button(tr('passport'),'passport','small secondary',a.propertyId)}</div></div>`).join('')}</section>`}
function filtered(){return visible().tickets.filter(t=>(filter==='all'||filter==='active'&&!['resolved','closed'].includes(t.status)||filter==='urgent'&&t.priority==='urgent'||filter==='approval'&&t.status==='approval'||filter==='completed'&&['resolved','closed'].includes(t.status))&&[t.id,t.title,propOf(t.propertyId)?.name,nameOf(t.techId)].join(' ').toLowerCase().includes(search.toLowerCase()))}
function requestResults(){const list=filtered();if(!list.length)return empty('noResults');if(viewMode==='board'&&role()!=='client')return `<div class="board">${[[['submitted'],'submitted'],[['scheduled','on_way','diagnosing'],'scheduled'],[['approval','working'],'working'],[['resolved','closed'],'completed']].map(([xs,k])=>`<section class="board-column"><h3>${tr(k)} <span>${list.filter(t=>xs.includes(t.status)).length}</span></h3>${list.filter(t=>xs.includes(t.status)).map(card).join('')}</section>`).join('')}</div>`;return `<div class="table-wrap"><table><thead><tr><th>${tr('allRequests')}</th><th>${tr('priority')}</th><th>${tr('updated')}</th><th>${tr('technician')}</th><th>${tr('actions')}</th></tr></thead><tbody>${list.map(t=>`<tr><td><button class="table-link" data-action="detail" data-id="${e(t.id)}"><b>${e(t.title)}</b><small>${e(t.id)} · ${e(propOf(t.propertyId)?.name)}</small></button></td><td>${priority(t)}</td><td>${badge(t)}</td><td>${t.techId?e(nameOf(t.techId)):tr('unassigned')}</td><td><button class="icon-btn" data-action="detail" data-id="${e(t.id)}" aria-label="${tr('view')}">${icon('arrow')}</button></td></tr>`).join('')}</tbody></table></div><div class="mobile-cards">${list.map(card).join('')}</div>`}
function requestsPage(){return heading(tr(role()==='client'?'requests':'allRequests'),tr('clientSub'))+`<section class="panel"><div class="panel-head"><h2>${tr('allRequests')} <span class="muted">${visible().tickets.length}</span></h2><div style="display:flex;gap:12px">${role()!=='client'?`<button class="text-btn" data-action="toggle-view">${tr(viewMode==='list'?'board':'list')}</button>`:''}<button class="text-btn" data-action="export">${icon('download')}${tr('export')}</button></div></div><div class="filters">${['all','active','urgent','approval','completed'].map(f=>`<button class="chip ${f===filter?'selected':''}" data-filter="${f}">${tr(f)}</button>`).join('')}<input class="search" id="request-search" aria-label="${tr('search')}" placeholder="${tr('search')}" value="${e(search)}"></div><div id="request-results">${requestResults()}</div></section>`}
function propertiesPage(){return heading(tr(role()==='client'?'properties':'allProperties'),tr('passportHint'),false)+(role()==='company'?`<div class="actions" style="margin:0 0 24px">${button(tr('addProperty'),'add-property','','','plus')}${button(tr('addAsset'),'add-asset','secondary','','plus')}</div>`:'')+`<div class="cards">${visible().properties.map(p=>`<article class="property-card"><div class="property-top">${icon('building')}<span class="badge">${tr(p.type)}</span></div><div class="property-body"><h3>${e(p.name)}</h3><p>${e(p.address)}</p><div class="property-summary"><span>${visible().assets.filter(a=>a.propertyId===p.id).length} ${tr('equipment')}</span><span>${openTickets().filter(t=>t.propertyId===p.id).length} ${tr('open')}</span></div>${button(tr('passport'),'passport','secondary',p.id,'arrow')}</div></article>`).join('')||empty('emptyProperties','building')}</div>`}
function teamPage(){return heading(tr('team'),tr('liveHint'),false)+`<div class="actions" style="margin:0 0 24px">${button(tr('addUser'),'add-user','','','plus')}</div><div class="cards">${visible().users.map(u=>`<article class="people-card">${avatar(u,'large')}<h3>${e(u.name)}</h3><p>${e(u.email||'')}</p><p>${e(u.trade||u.phone||'')}</p><span class="badge">${tr(u.role)}</span>${u.disabled?` <span class="badge">${tr('disabled')}</span>`:''}${u.role==='tech'?`<p>${openTickets().filter(t=>t.techId===u.id).length} ${tr('activeJobs')}</p>`:''}${u.id!==userId?`<div class="actions">${live?button(tr('resetPassword'),'reset-password','secondary small',u.id):''}${button(tr(u.disabled?'enable':'disable'),'disable-user','secondary small',u.id)}</div>`:''}</article>`).join('')}</div>`}
function settingsPage(){return heading(tr('settings'),tr('portal'),false)+`<div class="settings-grid"><section class="panel"><div class="panel-head"><h2>${tr('profile')}</h2>${icon('team')}</div><div class="panel-body"><div class="person-row">${avatar(user(),'large')}<div><b>${e(user().name)}</b><small>${e(user().email||'')} · ${tr(role())}</small></div></div><div class="actions">${button(tr('profile'),'edit-profile','secondary')}${live?button(tr('signout'),'logout','secondary','','logout'):''}</div></div><div class="setting-row"><h3>${tr('language')}</h3><div class="actions">${button(lang==='en'?'العربية':'English','language','secondary')}</div></div></section><section class="panel"><div class="panel-head"><h2>${tr('install')}</h2>${icon('phone')}</div><div class="panel-body"><p>${tr('installHint')}</p><div class="actions">${button(tr('install'),'install','secondary','','download')}</div></div></section><section class="panel"><div class="panel-head"><h2>${tr('security')}</h2>${icon('shield')}</div><div class="panel-body"><p>${tr(live?'liveHint':'demoAuth')}</p>${live?`<div class="actions">${button(tr('changePassword'),'change-password','secondary')}</div>`:''}</div></section>${!live?`<section class="panel"><div class="panel-head"><h2>${tr('demo')}</h2></div><div class="panel-body"><p>${tr('demoBackupHint')}</p><div class="actions">${button(tr('exportBackup'),'backup','secondary','','download')}${button(tr('resetDemo'),'reset-demo','danger')}</div></div></section>`:''}</div>`}
function progress(t){const step={submitted:0,scheduled:1,on_way:1,diagnosing:2,approval:2,working:3,resolved:4,closed:4}[t.status];return `<div class="progress-track">${['step_received','step_visit','step_check','step_repair','step_confirm'].map((k,i)=>`<div class="progress-item ${i<=step?'done':''} ${i===step?'current':''}">${tr(k)}</div>`).join('')}</div>`}
function historyHtml(t){return `<div class="timeline">${t.history.filter(h=>h.type!=='message').map(h=>`<div class="event"><b>${tr(h.type==='quote'?'estimate':h.type)}</b>${h.note?`<p>${e(h.note)}</p>`:''}${h.meta?.total!=null?`<p>${money(h.meta.total)}</p>`:''}${h.meta?.start?`<p>${when(h.meta.start)} · ${tr('qatar')}</p>`:''}<small>${e(nameOf(h.actorId))} · ${when(h.at)}</small></div>`).join('')}</div>`}
function quoteHtml(t){if(!t.quote)return '';return `<div class="quote-box"><h3>${tr('estimate')}</h3>${t.quote.description?`<p style="font-size:12px;margin-top:8px">${e(t.quote.description)}</p>`:''}<div class="quote-line"><span>${tr('labour')}</span><span>${money(t.quote.labour)}</span></div><div class="quote-line"><span>${tr('parts')}</span><span>${money(t.quote.parts)}</span></div><div class="quote-line total"><span>${tr('total')}</span><span>${money(t.quote.total)}</span></div>${t.quote.approvedAt?`<p style="font-size:11px;margin-top:10px">✓ ${tr('approved')} · ${when(t.quote.approvedAt)}</p>`:''}${t.status==='approval'?`<p style="font-size:11px;margin-top:13px">${tr('approvalHint')}</p>${role()==='client'?`<div class="actions">${button(tr('approve'),'approve','',t.id,'check')}${button(tr('decline'),'decline','secondary',t.id)}</div>`:`<p class="notice" style="margin-top:12px">${tr('pendingApproval')}</p>`}`:''}</div>`}
function detail(id){const t=visible().tickets.find(x=>x.id===id);if(!t)return;selectedId=id;draft=null;const tech=visible().users.find(u=>u.id===t.techId);let controls='';if(role()==='company'&&!['resolved','closed'].includes(t.status))controls+=button(tr('assign'),'assign','secondary',id,'calendar');if(['company','tech'].includes(role())&&t.techId){if(t.status==='scheduled')controls+=button(tr('onWay'),'on_way','',id,'arrow');if(['scheduled','on_way'].includes(t.status))controls+=button(tr('arrived'),'arrive','secondary',id,'check');if(t.status==='diagnosing')controls+=button(tr('recordDiagnosis'),'diagnosis','',id,'general');if(t.status==='working')controls+=button(tr('completeRepair'),'complete','',id,'check');}
if(role()==='client'&&t.status==='resolved')controls+=button(tr('confirmRepair'),'confirm','',id,'check');if(role()==='client'&&['resolved','closed'].includes(t.status))controls+=button(tr('stillIssue'),'reopen','secondary',id,'refresh');
modal(e(id)+' · '+tr('view'),`<div class="detail-header"><h2>${e(t.title)}</h2>${badge(t)}</div>${progress(t)}<div class="detail-grid">${[['property',propOf(t.propertyId)?.name],['location',t.unit],['category',tr(t.category)],['priority',tr(t.priority)],['contact',t.phone],['visitWindow',t.visitStart?when(t.visitStart)+' – '+fmt(t.visitEnd,{day:undefined,month:undefined,hour:'2-digit',minute:'2-digit'}):tr('notScheduled')]].map(([k,v])=>`<div><small>${tr(k)}</small>${e(v)}</div>`).join('')}</div><p class="detail-description">${e(t.description)}</p>${t.geo?locationBox(t):''}${t.accessNotes?`<p class="notice" style="margin-top:12px">${tr('accessNotes')}: ${e(t.accessNotes)}</p>`:''}${t.voice?`<div><audio controls preload="none" src="${e(t.voice)}"></audio></div>`:''}${tech?`<div class="person-row">${avatar(tech,'large warm')}<div><b>${e(tech.name)}</b><small>${e(tech.trade||tr('technician'))}</small></div>${tech.phone&&live?`<a class="btn secondary small" style="margin-inline-start:auto" href="tel:${e(tech.phone.replace(/[^+\d]/g,''))}">${icon('phone')}${tr('call')}</a>`:''}</div>`:''}${t.diagnosis?`<h3 class="section-title">${tr('diagnosis')}</h3><p class="detail-description">${e(t.diagnosis)}</p>`:''}${quoteHtml(t)}${t.repair?`<h3 class="section-title">${tr('workDone')}</h3><p class="detail-description">${e(t.repair)}</p>${t.warrantyUntil?`<p class="notice" style="margin-top:12px">${tr('warranty')}: ${fmt(t.warrantyUntil,{year:'numeric'})}</p>`:''}`:''}${t.before||t.after?`<div class="photo-grid">${[[t.before,'beforePhoto'],[t.after,'afterPhoto']].map(([src,k])=>`<div class="photo-box"><small>${tr(k)}</small>${src?`<img src="${e(src)}" alt="${tr(k)}" loading="lazy">`:`<div class="photo-empty">${tr('noPhoto')}</div>`}</div>`).join('')}</div>`:''}${controls?`<div class="actions">${controls}</div>`:''}${['resolved','closed'].includes(t.status)?`<div class="actions">${button(tr('repairReport'),'report','secondary',id,'download')}</div>`:''}<div class="tabs"><button data-action="tab-activity" class="${detailTab==='activity'?'selected':''}">${tr('timeline')}</button><button data-action="tab-chat" class="${detailTab==='chat'?'selected':''}">${tr('conversation')} (${t.history.filter(h=>h.type==='message').length})</button></div>${detailTab==='activity'?historyHtml(t):`<div class="messages">${t.history.filter(h=>h.type==='message').map(h=>`<div class="bubble ${h.actorId===userId?'mine':''}">${e(h.note)}<small>${e(nameOf(h.actorId))} · ${when(h.at)}</small></div>`).join('')||empty('noMessages','chat')}</div>`}<form id="message-form" class="message-form"><input name="note" required maxlength="1500" aria-label="${tr('writeMessage')}" placeholder="${tr('writeMessage')}"><button class="btn" type="submit">${tr('send')}</button></form>`);$('#message-form').onsubmit=async ev=>{ev.preventDefault();const id=await perform({type:'message',id:t.id,note:new FormData(ev.target).get('note')});if(id){detailTab='chat';render();detail(id)}}}
function field(label,name,value='',type='text',attrs=''){return `<label class="field">${tr(label)}<input type="${type}" name="${name}" value="${e(value)}" ${attrs}></label>`}
function selectField(label,name,options,value='',required=true){return `<label class="field">${tr(label)}<select name="${name}" ${required?'required':''}>${options.map(([v,k])=>`<option value="${e(v)}" ${v===value?'selected':''}>${e(k)}</option>`).join('')}</select></label>`}

case 'language':setLanguage();break;
case 'use-location':useCurrentLocation();break;
case 'open-map':if(draft)saveDraftStep();openLocationMap();break;
case 'remove-pin':if(draft){saveDraftStep();draft.geo=null;wizard()}break;
case 'coordinate-pin':if(draft){const lat=$('#pin-lat').value,lng=$('#pin-lng').value;if(!lat.trim()||!lng.trim()){toast(tr('invalidCoordinates'));break}try{const geo=Care.locationPin({lat:Number(lat),lng:Number(lng),source:'pin'});saveDraftStep();draft.geo=geo;wizard();toast(tr('locationSaved'))}catch{toast(tr('invalidCoordinates'))}}break;
case 'close':closeModal();break;
case 'new':startRequest();break;
case 'property-request':startRequest('',id);break;
case 'asset-request':startRequest(id);break;
case 'nav-requests':page='requests';render();break;
case 'nav-properties':page='properties';render();break;
case 'detail':detailTab='activity';detail(id);break;
case 'tab-activity':detailTab='activity';detail(selectedId);break;
case 'tab-chat':detailTab='chat';detail(selectedId);break;
case 'assign':assignForm(id);break;
case 'on_way':case 'arrive':await finishAction({type:action,id});break;
case 'diagnosis':diagnosisForm(id);break;
case 'approve':await finishAction({type:'approve',id});break;
case 'decline':case 'reopen':formModal(action==='decline'?'decline':'stillIssue',textField('reason','note'),action==='decline'?'decline':'stillIssue',f=>finishAction({type:action,id,...f}),action==='reopen'?tr('reopenHint'):'');break;
case 'complete':completeForm(id);break;
case 'confirm':confirmForm(id);break;
case 'passport':passport(id);break;
case 'qr':qrForm(id);break;
case 'print-qr':if(qrContext)printContent($('#qr-label').outerHTML);break;
case 'download-qr':if(qrContext)download('Unity-Care-'+qrContext.asset.id+'.svg',qrContext.svg,'image/svg+xml');break;
case 'copy-qr':if(qrContext){try{await navigator.clipboard.writeText(qrContext.url);toast(tr('copied'))}catch{formModal('copyLink',field('baseUrl','url',qrContext.url,'text','readonly'),'closeDialog',()=>closeModal())}}break;
case 'report':report(id);break;
case 'service-date':{const a=assetOf(id);formModal('nextService',field('nextService','nextService',a.nextService,'date','required'),'save',async f=>{if(await perform({type:'service_date',assetId:id,...f})){render();passport(a.propertyId)}});break;}
case 'add-property':propertyForm();break;
case 'add-asset':assetForm(id);break;
case 'add-user':userForm();break;
case 'disable-user':{const target=visible().users.find(u=>u.id===id);if(await perform({type:'disable_user',userId:id,disabled:!target.disabled})){render();toast(tr('saved'))}break;}
case 'reset-password':formModal('resetPassword',field('newPassword','password','','password','required minlength="12" maxlength="200" autocomplete="new-password"'),'save',async f=>{if(await perform({type:'reset_password',userId:id,...f})){closeModal();render();toast(tr('saved'))}},tr('passwordHint'));break;
case 'edit-profile':formModal('profile',field('name','name',user().name,'text','required maxlength="80"')+field('contact','phone',user().phone||'','tel','maxlength="30"')+`<label class="field full">${tr('photo')}<input id="profile-photo" type="file" accept="image/jpeg,image/png,image/webp"><small>${tr('photoHint')}</small></label>`,'save',async f=>{const file=$('#profile-photo').files[0];if(file)f.avatar=await imageFile(file);if(await perform({type:'profile',...f})){closeModal();render();toast(tr('saved'))}});break;
case 'change-password':formModal('changePassword',field('currentPassword','current','','password','required autocomplete="current-password"')+field('newPassword','password','','password','required minlength="12" maxlength="200" autocomplete="new-password"'),'save',async f=>{await api('password',f);closeModal();data=null;userId='';renderLogin();toast(tr('saved'))});break;
case 'logout':try{await api('logout',{})}catch(error){toast(error.message);return}data=null;userId='';csrf='';closeModal();renderLogin();break;
case 'toggle-view':viewMode=viewMode==='list'?'board':'list';render();break;
case 'export':csvExport();break;
case 'notifications':notifications();break;
case 'read-updates':pref.set('care-read-'+userId,new Date().toISOString());render();notifications();break;
case 'wizard-back':saveDraftStep();stopRecording();wizardStep=Math.max(0,wizardStep-1);wizard();break;
case 'record':await recordVoice();break;
case 'remove-voice':saveDraftStep();draft.voice='';wizard();break;
case 'remove-photo':saveDraftStep();draft.before='';wizard();break;
case 'backup':download('Unity-Care-Demo-Backup.json',JSON.stringify({exportedAt:new Date().toISOString(),state:data},null,2),'application/json');break;
case 'reset-demo':formModal('resetDemo',`<p class="notice warn full">${tr('resetConfirm')}</p>`,'resetDemo',async()=>{const next=Care.seed();await localSave(next);data=next;userId='sara';version++;closeModal();page='home';render()});break;
case 'install':if(installPrompt){await installPrompt.prompt();installPrompt=null}else toast(tr('installHint'));break;
}}
document.addEventListener('click',async ev=>{const nav=ev.target.closest('[data-nav]');if(nav){ev.preventDefault();if(!data)return;page=nav.dataset.nav;search='';filter='all';render();window.scrollTo({top:0,behavior:'smooth'});return}const filterButton=ev.target.closest('[data-filter]');if(filterButton){filter=filterButton.dataset.filter;render();return}const category=ev.target.closest('[data-category]');if(category&&draft){saveDraftStep();draft.category=category.dataset.category;wizard();return}const b=ev.target.closest('[data-action]');if(b){ev.preventDefault();try{await actions(b.dataset.action,b.dataset.id||'',b)}catch(error){inlineError(error)}}});
$('#modal').addEventListener('cancel',()=>{destroyMap();stopRecording();draft=null;selectedId=''});window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();installPrompt=ev});window.addEventListener('offline',()=>{if(data)render()});window.addEventListener('online',()=>{if(live&&data&&!$('#modal').open)pull().catch(()=>toast(tr('syncFail')));else if(data)render()});window.addEventListener('afterprint',()=>{$('#print-area').innerHTML=''});
(async()=>{document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('#app').innerHTML='<div class="loading">Unity Care…</div>';if(live){try{accept(await api('state'));render();openAssetLink()}catch(error){renderLogin(error.status===401?'':error.message)}}else{data=await localLoad()||Care.seed();userId=pref.get('care-user')||'sara';if(!data.users.some(u=>u.id===userId&&!u.disabled))userId=data.users.find(u=>!u.disabled)?.id||'sara';await localSave(data);render();openAssetLink()}if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});setInterval(()=>{if(live&&userId&&document.visibilityState==='visible'&&!$('#modal').open&&!busy)pull().catch(error=>{if(error.status===401){data=null;userId='';renderLogin()}else toast(tr('syncFail'))})},20000)})().catch(error=>{$('#app').innerHTML='<div class="empty">'+e(error.message)+'</div>'});
</script></body></html>
