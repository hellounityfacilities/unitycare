</style></head><body><aside><a class="brand" href="#"><span class="logo">u<span>✳</span></span> unity<span class="light">care</span></a><div class="workspace">UFM WORKSPACE <span>DEMO</span></div><nav><button class="active" data-page="overview">◫ <span>Overview</span></button><button data-page="requests">▤ <span>Service requests</span></button><button data-page="schedule">▦ <span>Visit schedule</span></button><button data-page="properties">⌂ <span>Properties</span></button><button data-page="team">♧ <span>Service team</span></button></nav><div class="aside-bottom"><div class="help"><b>A little care.<br>A better space.</b><p>Every issue, every update.<br>All in one place.</p><span>↗</span></div><small>UNITY FACILITIES MANAGEMENT</small></div></aside><div class="shell"><header><div class="crumb">Workspace <span>/</span> <b id="crumb">Overview</b></div><div class="account"><label for="role">Preview as</label><select id="role"><option value="company">Maintenance company</option><option value="client">Client · Sara Ahmed</option><option value="tech">Technician · Omar Ali</option></select><span class="avatar">UC</span></div></header><main id="main"></main><footer><span class="dot"></span> Interactive demo · Data stays in this browser. No live dispatch or notifications.</footer></div><dialog id="modal"></dialog><div id="toast" role="status"></div><script>const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let tickets;try{tickets=JSON.parse(localStorage.getItem('unity-care-v1'))||structuredClone(seeds)}catch{tickets=structuredClone(seeds)}let role='company',page='overview',filter='All',query='';
function save(){try{localStorage.setItem('unity-care-v1',JSON.stringify(tickets));return true}catch{toast('Storage is full. Please use a smaller photo.');return false}}

const building=`<svg class="drawing" viewBox="0 0 300 205" fill="none" aria-hidden="true"><circle cx="163" cy="109" r="91" stroke="#517263"/><circle cx="163" cy="109" r="72" stroke="#36594d"/><path d="M49 174h220" stroke="#86a578"/><path d="M91 173V62l64-28 61 28v111" fill="#244f45" stroke="#b4c9a0" stroke-width="2"/><path d="M155 34v139M91 62l64 27 61-27" stroke="#b4c9a0" stroke-width="2"/><path d="M106 84l29 13v25l-29-13zm0 47l29 13v23l-29-13zM171 95l27-12v26l-27 12zm0 48l27-12v26l-27 12z" fill="#c9e897"/><path d="M66 172v-30m0 9c-35-18-19-40-6-27 10-24 30-9 6 27" stroke="#96b985" stroke-width="2"/><rect x="210" y="46" width="46" height="46" rx="14" fill="#d8ee9b" transform="rotate(10 210 46)"/><path d="m223 69 8 9 15-15" stroke="#173e38" stroke-width="3" stroke-linecap="round"/><circle cx="73" cy="59" r="5" fill="#d8ee9b"/><path d="M246 130v14m-7-7h14" stroke="#c9e897" stroke-width="2"/></svg>`;
function heading(title,subtitle,action=true){return `<div class="heading"><div><h1>${title}</h1><p>${subtitle}</p></div>${action&&role!=='tech'?'<button class="btn" id="new">＋ New request</button>':''}</div>`}
function requestTable(){let rows=visible().filter(t=>(filter==='All'||(filter==='Open'?!['Resolved','Closed'].includes(t.status):filter==='Completed'?['Resolved','Closed'].includes(t.status):t.priority==='Urgent'))&&[t.id,t.title,t.property,t.client,t.tech].join(' ').toLowerCase().includes(query.toLowerCase()));return `<div class="table-wrap"><table><thead><tr><th>REQUEST / LOCATION</th><th>PRIORITY</th><th>STATUS</th><th>ASSIGNED TO</th><th></th></tr></thead><tbody>${rows.map(t=>`<tr><td><button class="request-link" data-id="${t.id}"><b>${esc(t.title)}</b><small>${t.id} · ${esc(t.property)}</small></button></td><td><span class="priority ${t.priority}">${t.priority}</span></td><td>${badge(t.status)}</td><td>${esc(t.tech||'Unassigned')}</td><td><button class="text-btn" data-id="${t.id}" aria-label="Open ${t.id}">↗</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No matching requests.</td></tr>'}</tbody></table></div>`}
function visitList(){return visible().filter(t=>t.visit&&!['Closed','Resolved'].includes(t.status)).sort((a,b)=>a.visit.localeCompare(b.visit)).map(t=>`<div class="visit"><div class="visit-top"><span>${esc(t.visit.replace('T',' · '))}</span><span>QATAR TIME</span></div><h3>${esc(t.title)}</h3><p>⌂ ${esc(t.property)}</p><div class="person"><span class="avatar">${esc(t.tech.split(' ').map(x=>x[0]).join(''))}</span>${esc(t.tech)}<button class="text-btn" style="margin-left:auto" data-id="${t.id}">View ↗</button></div></div>`).join('')||'<div class="empty">No visits scheduled yet.</div>'}
function render(){const list=visible();let title={overview:'Overview',requests:'Service requests',schedule:'Visit schedule',properties:'Properties',team:'Service team'}[page];$('#crumb').textContent=title;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let html='';if(page==='overview'||page==='requests'){html=heading(page==='overview'?(role==='company'?'Every space, taken care of.':role==='client'?'Hello, Sara. Let’s take care of it.':'Your workday, organised.'):title,role==='company'?'Your maintenance operations, all in one place.':role==='client'?'Report an issue and follow every step of the repair.':'Your assigned visits and service updates.');if(page==='overview'){html+=`<section class="hero"><div><div class="eyebrow">CONNECTED CARE. COMPLETE VISIBILITY.</div><h2>From “something’s wrong”<br>to <em>“all taken care of.”</em></h2><p>One request. A clear plan. Updates at every step.</p><button class="btn" id="hero-action">${role==='client'?'Report an issue ↗':'View service requests ↗'}</button></div>${building}</section><div class="stats">${[['Open requests',list.filter(t=>!['Closed','Resolved'].includes(t.status)).length,'Awaiting action or being serviced','▤'],['In progress',list.filter(t=>['Diagnosing','In progress'].includes(t.status)).length,'Hands-on care, underway','⚒'],['Upcoming visits',list.filter(t=>t.visit&&!['Closed','Resolved'].includes(t.status)).length,'Scheduled with a technician','▦'],['Resolved / closed',list.filter(t=>['Resolved','Closed'].includes(t.status)).length,'Repairs ready for review','✓']].map(([n,v,s,i])=>`<div class="stat"><div class="stat-top">${n}<span class="stat-icon">${i}</span></div><strong>${v}</strong><small>${s}</small></div>`).join('')}</div>`}html+=`<div class="${page==='overview'?'grid':''}"><section class="panel"><div class="panel-head"><h2>${page==='overview'?'Recent requests':'Request centre'}</h2><button class="text-btn" id="export">Export CSV ↓</button></div><div class="filters">${['All','Open','Urgent','Completed'].map(f=>`<button data-filter="${f}" class="${filter===f?'selected':''}">${f}</button>`).join('')}<input id="search" aria-label="Search requests" placeholder="Search requests…" value="${esc(query)}"></div><div id="table">${requestTable()}</div></section>${page==='overview'?`<div class="side-panel"><section class="panel"><div class="panel-head"><h2>Upcoming visits</h2><span class="badge">Qatar</span></div>${visitList()}</section><div class="bottom-note"><b>Keep everyone in the loop.</b>Every assignment, diagnosis and repair is recorded in the request timeline.</div></div>`:''}</div>`}else if(page==='schedule'){html=heading(title,'All scheduled service visits · Qatar local time',false)+`<section class="panel">${visitList()}</section>`}else if(page==='properties'){html=heading(title,'Homes, apartments, buildings and workplaces.',false)+`<div class="cards">${properties.filter(p=>role!=='client'||p.owner==='Sara Ahmed').map(p=>`<article class="card"><div class="big-icon">⌂</div><h3>${p.name}</h3><span class="badge">${p.type}</span><p>${p.address}</p><p>${p.owner}</p><b>${visible().filter(t=>t.property===p.name&&!['Resolved','Closed'].includes(t.status)).length} open requests</b></article>`).join('')}</div>`}else{html=heading(title,'Specialist care for every type of maintenance.',false)+`<div class="cards">${team.map(t=>`<article class="card"><span class="avatar">${t.initials}</span><h3>${t.name}</h3><p>${t.trade}</p><span class="badge">${tickets.filter(x=>x.tech===t.name&&!['Closed','Resolved'].includes(x.status)).length} active assignments</span></article>`).join('')}</div>`}$('#main').innerHTML=html;$('#new')?.addEventListener('click',newRequest);$('#hero-action')?.addEventListener('click',()=>{if(role==='client')newRequest();else{page='requests';render()}});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});$('#search')?.addEventListener('input',e=>{query=e.target.value;$('#table').innerHTML=requestTable();bindDetails()});$('#export')?.addEventListener('click',exportCSV);bindDetails()}
function bindDetails(){document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>detail(b.dataset.id))}
function newRequest(){openModal('What needs attention?',`<p style="margin-bottom:18px">Tell us what happened. We’ll keep the full history in one place.</p><form id="request-form"><div class="form-grid"><label class="field full">Issue title<input name="title" required maxlength="100" placeholder="e.g. AC is not cooling in the living room"></label><label class="field">Property<select name="property">${properties.filter(p=>role!=='client'||p.owner==='Sara Ahmed').map(p=>`<option>${p.name}</option>`).join('')}</select></label><label class="field">Unit / exact location<input name="unit" required maxlength="150" placeholder="Apartment 402, living room"></label><label class="field">Service category<select name="category">${['AC & ventilation','Plumbing','Electrical','General maintenance','Painting','Cleaning','Other'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">Priority<select name="priority"><option>Normal</option><option>High</option><option>Urgent</option></select></label><label class="field full">What is the problem?<textarea name="description" required maxlength="2000" placeholder="Describe the fault and when it started."></textarea></label><label class="field">Contact number<input name="phone" type="tel" required maxlength="30" placeholder="+974 …"></label><label class="field">Photo (optional, max 1 MB)<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label></div><p class="notice" style="margin-top:16px">Demo requests are saved on this device only. For immediate danger, contact local emergency services directly.</p><div class="actions"><button class="btn" type="submit">Submit request →</button></div></form>`);$('#request-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),p=properties.find(p=>p.name===f.get('property')),file=$('#photo').files[0];let photo='';if(file){if(file.size>1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Choose a JPG, PNG or WebP image under 1 MB.');return}photo=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}let t={...Object.fromEntries(f),id:'UC-'+(Math.max(1048,...tickets.map(x=>Number(x.id.slice(3))||0))+1),client:p.owner,status:'Submitted',tech:'',visit:'',quote:0,diagnosis:'',photo,history:[{text:'Request submitted by '+p.owner,at:new Date().toISOString()}]};tickets.unshift(t);if(!save()){tickets.shift();return}$('#modal').close();filter='All';query='';page='requests';render();toast('Request '+t.id+' created');detail(t.id)}}
function detail(id){let t=visible().find(t=>t.id===id);if(!t)return;openModal(`${t.id} · Request details`,`<div style="display:flex;justify-content:space-between;gap:12px"><h2>${esc(t.title)}</h2>${badge(t.status)}</div><div class="progress-steps">${stages.map((s,i)=>`<span title="${s}" class="${i<=stages.indexOf(t.status)?'filled':''}"></span>`).join('')}</div><div class="details">${[['Property',t.property],['Location',t.unit],['Client',t.client],['Contact',t.phone],['Category',t.category],['Priority',t.priority],['Technician',t.tech||'Awaiting assignment'],['Visit (Qatar time)',t.visit?t.visit.replace('T',' · '):'Not scheduled']].map(([k,v])=>`<div><small>${k}</small>${esc(v)}</div>`).join('')}</div><p>${esc(t.description)}</p>${t.photo?`<img class="photo" alt="Photo attached to maintenance request" src="${t.photo}">`:''}${t.diagnosis?`<div class="notice" style="margin-top:14px"><b>Diagnosis / repair notes</b><br>${esc(t.diagnosis)}${t.quote?`<br>Estimated cost: QAR ${esc(t.quote)}`:''}</div>`:''}<h3>Request timeline</h3><div class="timeline">${t.history.map(h=>`<div class="event">${esc(h.text)}<small>${stamp(h.at)} · Qatar</small></div>`).join('')}</div><div id="controls"></div><form id="comment-form"><label class="field">Add a request update<input name="note" required maxlength="500" placeholder="Write an update or question…"></label><div class="actions"><button class="btn secondary">Add to timeline</button></div></form>`);let controls='';if(role==='company'&&!['Closed','Resolved'].includes(t.status)){controls+=`<form id="assign-form" class="notice"><div class="form-grid"><label class="field">Assign technician<select name="tech" required><option value="">Choose technician</option>${team.map(x=>`<option ${t.tech===x.name?'selected':''}>${x.name}</option>`).join('')}</select></label><label class="field">Visit date & time (Qatar)<input type="datetime-local" name="visit" value="${esc(t.visit)}"></label></div><div class="actions"><button class="btn">Save assignment / visit</button></div></form>`}if(['company','tech'].includes(role)&&t.tech&&!['Submitted','Awaiting approval','Resolved','Closed'].includes(t.status)){let next={Assigned:'On the way',Scheduled:'On the way','On the way':'Diagnosing',Diagnosing:'In progress','In progress':'Resolved'}[t.status];controls+=`<form id="work-form" style="margin-top:18px"><label class="field">${t.status==='In progress'?'Repair completed / work done':'Diagnosis / work notes'}<textarea name="diagnosis" required maxlength="1500">${esc(t.diagnosis)}</textarea></label>${t.status==='Diagnosing'?'<label class="field" style="margin-top:12px">Estimated repair cost (QAR)<input name="quote" type="number" min="0" max="1000000" step="0.01" value="0"></label>':''}<div class="actions"><button class="btn" name="action" value="${next}">${next==='Resolved'?'Mark repaired → Client review':'Move to '+next}</button>${t.status==='Diagnosing'?'<button class="btn secondary" name="action" value="Awaiting approval">Request client approval</button>':''}</div></form>`}if(role==='client'&&t.status==='Awaiting approval'){controls+=`<div class="notice">Please review the diagnosis and estimate before authorising work.</div><div class="actions"><button class="btn" id="approve">Approve QAR ${esc(t.quote||0)} repair</button><button class="btn secondary" id="decline">Decline estimate</button></div>`}if(role==='client'&&t.status==='Resolved'){controls+=`<div class="notice">The repair is ready for your review. Confirm completion or reopen if the issue continues.</div><div class="actions"><button class="btn" id="confirm">Confirm completion ✓</button><button class="btn secondary" id="reopen">Issue not resolved</button></div>`}$('#controls').innerHTML=controls+'<hr style="border:0;border-top:1px solid #e3e8e2;margin:22px 0">';$('#assign-form')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);t.tech=f.get('tech');t.visit=f.get('visit');if(['Submitted','Assigned','Scheduled'].includes(t.status))t.status=t.visit?'Scheduled':'Assigned';change(t,'Assigned to '+t.tech+(t.visit?' · Visit: '+t.visit.replace('T',' ')+' Qatar time':''))});$('#work-form')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);t.diagnosis=f.get('diagnosis');t.quote=Number(f.get('quote')||t.quote||0);t.status=e.submitter.value;change(t,t.status+' · '+t.diagnosis+(t.status==='Awaiting approval'?' · Estimate QAR '+t.quote:''))});$('#approve')?.addEventListener('click',()=>{t.status='In progress';change(t,'Client approved estimate of QAR '+t.quote)});$('#decline')?.addEventListener('click',()=>{t.status='Diagnosing';change(t,'Client declined estimate. Revised diagnosis / quote requested.')});$('#confirm')?.addEventListener('click',()=>{t.status='Closed';change(t,'Client confirmed the repair and closed the request.');toast('Request closed. Thank you!')});$('#reopen')?.addEventListener('click',()=>{t.status='Diagnosing';change(t,'Client reopened request: issue continues. Technician follow-up required.')});$('#comment-form').onsubmit=e=>{e.preventDefault();let note=new FormData(e.target).get('note').trim();if(note)change(t,(role==='client'?'Sara Ahmed':role==='tech'?'Omar Ali':'Dispatch team')+': '+note)}}
function exportCSV(){let cells=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';let data=[['Request','Issue','Property','Client','Status','Technician','Visit Qatar time'],...visible().map(t=>[t.id,t.title,t.property,t.client,t.status,t.tech,t.visit])];let url=URL.createObjectURL(new Blob([data.map(r=>r.map(cells).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8;'}));let a=document.createElement('a');a.href=url;a.download='unity-care-requests.csv';a.click();URL.revokeObjectURL(url);toast('Request report exported')}
$('#role').onchange=e=>{role=e.target.value;filter='All';query='';render()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});window.addEventListener('storage',e=>{if(e.key==='unity-care-v1'){try{tickets=JSON.parse(e.newValue)||tickets;render()}catch{}}});render();
</script></body></html>
